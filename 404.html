<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Nie znaleziono | Karol Polikarp Wilczyński</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="Strona nie została znaleziona. Wróć na stronę główną karolwilczynski.com.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
    <link rel="icon" href="/favicon.ico?v=3" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
    <meta name="theme-color" content="#004d2b">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #004d2b;
            --color-phthalo: #1d5c43;
            --color-accent: #c9a962;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            /* Verde Alpi marble, darkened in the middle for the text */
            background:
                radial-gradient(ellipse 60% 55% at 50% 50%, rgba(18, 16, 13, 0.86) 0%, rgba(18, 16, 13, 0.72) 70%, rgba(18, 16, 13, 0.6) 100%),
                url("/assets/images/brand/verde-alpi-sm.webp?v=2") center / cover no-repeat,
                #12100d;
            color: #f5f3f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        @media (min-width: 1200px) {
            body {
                background:
                    radial-gradient(ellipse 60% 55% at 50% 50%, rgba(18, 16, 13, 0.86) 0%, rgba(18, 16, 13, 0.72) 70%, rgba(18, 16, 13, 0.6) 100%),
                    url("/assets/images/brand/verde-alpi.webp?v=2") center / cover no-repeat,
                    #12100d;
            }
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 4rem;
            color: var(--color-accent);
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.1rem;
            color: #f5f3f0;
            margin-bottom: 2rem;
        }
        a {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-phthalo) 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: inset 0 0 0 1px rgba(201, 169, 98, 0.45);
            transition: background 250ms ease, color 250ms ease;
        }
        a:hover { background: var(--color-accent); color: #12100d; }
        a:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>Strona, której szukasz, nie istnieje.</p>
        <a href="/">Wróć na stronę główną</a>
    </main>
</body>
</html>
