<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Karol Polikarp Wilczyński</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fdfcfa;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 6rem;
            font-weight: 600;
            color: #004d2b;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-message {
            font-size: 1.1rem;
            color: #5a5a5a;
            margin-bottom: 2rem;
        }
        .error-link {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #004d2b;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.25s ease;
        }
        .error-link:hover {
            background: #1a6b42;
        }
    </style>
</head>
<body>
    <main>
        <div class="error-code">404</div>
        <p class="error-message">Tej strony nie ma. Ale reszta portfolio działa.</p>
        <a href="/" class="error-link">Wróć na stronę główną</a>
    </main>
</body>
</html>
